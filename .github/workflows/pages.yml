name: Build and deploy Lela Decorações

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PATH_PREFIX: ${{ vars.PATH_PREFIX || '/' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://leladecoracoes.com' }}
      GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID || '' }}
      GA4_ENHANCED_OUTBOUND_CLICKS_DISABLED: ${{ vars.GA4_ENHANCED_OUTBOUND_CLICKS_DISABLED || 'false' }}
      GA4_ENHANCED_FORM_INTERACTIONS_DISABLED: ${{ vars.GA4_ENHANCED_FORM_INTERACTIONS_DISABLED || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and validate
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
